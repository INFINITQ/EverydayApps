packages:
  - apps/*
  - packages/*

# --- Supply-chain policy -------------------------------------------------------------
# Folio never talks to the network at run time, so the code we ship must come from
# boring, trusted releases. See README.md, "Privacy".

# Write exact versions into package.json; pnpm-lock.yaml pins the rest.
saveExact: true

# Don't install anything published less than 3 days ago (in minutes). Hijacked or
# malicious releases are usually spotted and pulled within that window.
minimumReleaseAge: 4320

# Fail the install if a package's publishing trust level drops compared to earlier
# releases (for example, it used to ship with provenance and suddenly doesn't).
trustPolicy: no-downgrade
# Reviewed exceptions. Each must be an exact version with a reason.
trustPolicyExclude:
  # Backport from npm's own team fixing CVE-2022-25883 (ReDoS) on the 6.x line. It was
  # published after 7.x releases that carried provenance, so the date-based check flags it.
  - 'semver@6.3.1'

# Only direct dependencies may come from git or tarball URLs.
blockExoticSubdeps: true

# Dependency install scripts never run unless listed here as `true`. Any unreviewed
# script makes the install fail (strictDepBuilds) instead of being silently skipped.
strictDepBuilds: true
allowBuilds: { protobufjs: set this to true or false }

# Removed dependencies (reviewed). @univerjs/protocol lists the gRPC client @grpc/grpc-js
# (and through it protobufjs, which has an install script), but its browser build imports
# nothing: Folio Sheets never loads either. Dropping them keeps network code out of the tree.
overrides:
  '@univerjs/protocol>@grpc/grpc-js': '-'
